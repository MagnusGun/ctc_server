[package]
name = "server"
version = "0.7.1"
edition.workspace = true
rust-version = "1.96"
license = "MIT"

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
gpiocdev.workspace = true

# Local-only dependencies
axum = "0.8.8"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
tokio-modbus = { version = "0.17.0", default-features = false, features = ["rtu"] }
tokio-serial = "5.4.5"
config = "0.15.19"
toml = "0.9.8"
nom = "8.0.0"
serde_json = "1.0.148"
tower-http = { version = "0.6.8", features = ["fs"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.31"
rustls = { version = "0.23.35", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
redb = "2.2"
thiserror = "2.0"
hdrhistogram = "7"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.13"
tokio = { workspace = true, features = ["test-util"] }
