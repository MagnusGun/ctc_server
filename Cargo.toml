[workspace]
resolver = "2"
members = [
    "server",
    # "portal",
    # "db",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.16"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
serde = { version = "1.0.228", features = ["derive"] }
