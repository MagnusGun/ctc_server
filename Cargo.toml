[workspace]
resolver = "2"
members = [
    "server",
    # "portal",
    # "db",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.46.1", features = ["full"] }
tokio-util = "0.7.15"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
serde = { version = "1.0.219", features = ["derive"] }
