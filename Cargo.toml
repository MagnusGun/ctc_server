[workspace]
resolver = "2"
members = [
    "server",
    "smartgrid_test",
    # "portal",
    # "db",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
serde = { version = "1.0.228", features = ["derive"] }
gpiocdev = "0.8.0"
